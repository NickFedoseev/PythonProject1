[tool.poetry]
name = "my_project"
version = "0.1.0"
description = "Banking transactions processing with currency conversion"
authors = ["Nikita Fedoseev <bobinslive@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.5"
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"
types-requests = "^2.32.4.20250809"

[tool.poetry.scripts]
banking = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ======================
# Конфигурация pytest
# ======================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# ======================
# Конфигурация coverage
# ======================
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["**/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]

# ======================
# Конфигурация Black
# ======================
[tool.black]
line-length = 119
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

# ======================
# Конфигурация isort
# ======================
[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
known_third_party = ["requests", "pytest", "dotenv"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ======================
# Конфигурация flake8
# ======================
[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]
max-complexity = 10

# ======================
# Конфигурация mypy
# ======================
[tool.mypy]
files = ["src/", "tests/"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
exclude = ["venv", ".venv", "build", "dist"]

[[tool.mypy.overrides]]
module = ["pytest.*", "unittest.*"]
ignore_missing_imports = true